name: paper-radar

# Forward paper recorder for the earnings short-straddle book with the
# name-persistence overlay. Runs after the US close on weekdays, on GitHub's
# servers, so the book keeps accruing with the local machine off. Books are
# committed back to the repo and are the record itself.
#
# Setup (one-time):
#   1. Enable Actions on the repo.
#   2. Add repository secret FINNHUB_API_KEY (Settings -> Secrets -> Actions).
#      Chains and spot come from yfinance and need no key.
#
# The job fails rather than commits an empty book when events were due and none
# could be snapshotted: yfinance is sometimes rate-limited from datacenter IPs, and
# a green run that persists nothing is indistinguishable from a quiet calendar.
# If that starts happening daily, run scripts/paper_radar.py locally on a schedule.

on:
  schedule:
    # 21:15 UTC Mon-Fri: after the 16:00 ET close year-round (17:15 ET under EDT,
    # 16:15 ET under EST), so the entry snapshot is the final end-of-day chain.
    - cron: "15 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two runs write the book at once.
concurrency:
  group: paper-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Check the recorder is configured
        # The earnings calendar needs a Finnhub key. Without it there is nothing to
        # record, which is a repository that has not been set up rather than a fault:
        # skip cleanly instead of failing, so an unconfigured clone does not carry a
        # daily red run it cannot fix.
        id: configured
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "::notice::FINNHUB_API_KEY is not set; skipping the forward recorder."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.configured.outputs.ready == 'true'
        name: Install dependencies
        run: pip install pandas numpy scipy pyarrow requests yfinance

      - if: steps.configured.outputs.ready == 'true'
        name: Confirm the richness seed is present
        # Without it the radar records every name with rich status "unknown", which
        # is an unconditional book, not the overlay. Better to know on day one.
        run: |
          test -f data/rich_set.csv || { echo "::error::data/rich_set.csv missing - rebuild with scripts/build_rich_seed.py"; exit 1; }
          echo "seed rows: $(( $(wc -l < data/rich_set.csv) - 1 ))"

      - if: steps.configured.outputs.ready == 'true'
        name: Run paper radar
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/paper_radar.py

      - if: steps.configured.outputs.ready == 'true'
        name: Verify the books match the schema before committing
        # The header on disk decides which fields a booked row keeps: appending a dict to
        # a frame read off an older header silently discards every key that header does
        # not name. That once dropped the exit mark and its provenance from the first
        # live trade while still writing a plausible-looking return. Check here so a
        # non-canonical book can never reach the remote, rather than surfacing on
        # whichever later run happens to read a column that is no longer there.
        run: |
          python - <<'PY'
          import csv
          import sys
          from pathlib import Path

          from scripts.paper_radar import LEDGER_COLS, OPEN_COLS

          bad = False
          for path, cols in (
              (Path("outputs/paper/radar_ledger.csv"), LEDGER_COLS),
              (Path("outputs/paper/radar_open_positions.csv"), OPEN_COLS),
          ):
              if not path.exists():
                  continue
              with path.open(newline="") as fh:
                  header = next(csv.reader(fh), [])
              if header != cols:
                  print(f"::error::{path} header does not match the schema")
                  print(f"  missing: {[c for c in cols if c not in header]}")
                  print(f"  unexpected: {[c for c in header if c not in cols]}")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - if: steps.configured.outputs.ready == 'true'
        name: Commit updated books
        run: |
          git config user.name "paper-radar[bot]"
          git config user.email "paper-radar@users.noreply.github.com"
          git add outputs/paper/radar_open_positions.csv outputs/paper/radar_ledger.csv
          if git diff --cached --quiet; then
            echo "book unchanged today"
            exit 0
          fi
          git commit -m "paper radar: book update $(date -u +%Y-%m-%d)"
          # Rebase onto any commit that landed while this run was working, so a
          # concurrent push does not drop a day of the book.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
