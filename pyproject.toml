[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-iv-crush"
version = "0.1.0"
description = "Filtered cross-sectional short-volatility strategy around scheduled earnings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jordan Odorico" }]
keywords = ["quant", "options", "volatility", "earnings", "backtest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
    "databento>=0.80",
    "ib_async>=2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "black>=24.0", "mypy>=1.8", "pytest>=8.0", "pre-commit>=3.5", "py_vollib>=1.0"]

[project.urls]
Repository = "https://github.com/quanttqueensu/earnings_iv_crush"
Documentation = "https://github.com/quanttqueensu/earnings_iv_crush/tree/main/docs"

[tool.setuptools.packages.find]
include = ["earnings_iv_crush*"]

# ── Lint / format / type ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
# outputs/research holds each programme's scripts as they ran; their hashes are pinned in freeze
# notes, so they are records, not code to restyle.
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]   # line length is owned by black

# The repository's own top-level packages, so import sorting is identical locally and in CI.
[tool.ruff.lint.isort]
known-first-party = ["earnings_iv_crush", "research", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures build equal-length columns by construction, so the strict-zip
# rule adds noise without catching bugs there.
"tests/**" = ["B905"]
# Closed studies are frozen (CLAUDE.md), so their lint findings are recorded here, not edited
# away. The B023 closures in move-forecast-and-sizing are each called inside the loop pass that
# defines them, so they bind the current values and the recorded results are unaffected.
"research/off_earnings/2026-11-02-index-hedged-hold/study.py" = ["UP031"]
"research/off_earnings/2026-11-02-next-day-expiry-settle/study.py" = ["UP031"]
"research/selection/2026-11-12-move-forecast-and-sizing/study.py" = ["B905", "B023"]
"research/selection/2026-11-12-tail-event-signals/study.py" = ["B905", "E731"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "^/outputs/"

[tool.mypy]
# Match the version CI runs on (3.12): modern numpy ships stubs using 3.12-only
# `type` statements, which a 3.10 target rejects at parse time before checking our code.
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true

# Promoted verbatim from the research scripts, where they were never type-checked. Their
# logic is frozen (the twelve-year book reproduces through them byte for byte), so the
# pandas-stub overload complaints are silenced here rather than fixed by editing the code.
[[tool.mypy.overrides]]
module = [
    "earnings_iv_crush.research.market_marks",
    "earnings_iv_crush.research.gates",
    "earnings_iv_crush.research.chains",
]
disable_error_code = [
    "call-overload", "operator", "arg-type", "assignment", "index", "union-attr", "attr-defined",
]

# ── Tests ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not live" -ra'
markers = [
    "live: hits real network/APIs; deselected by default. Run with -m live.",
]
